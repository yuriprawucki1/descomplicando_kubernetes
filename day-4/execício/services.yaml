# Service for MySQL
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: meu-site
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# Service for WordPress
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: meu-site
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
