apiVersion: v1
kind: Pod
metadata:
  name: giropops-pod
spec:
  containers:
    - name: giropops-pod
      image: nginx
      env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: giropay-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: giropay-secret
              key: password