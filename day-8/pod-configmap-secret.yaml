apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nginx
  name: giropops-pod
spec:
  containers:
    - name: giropops-pod
      image: nginx
      ports:
        - containerPort: 80
        - containerPort: 443
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: tls-secret
          mountPath: /etc/nginx/tls
          readOnly: true
  volumes:
    - name: nginx-config
      configMap:
        name: nginx-config
    - name: tls-secret
      secret:
        secretName: tls-secret
        items:
          - key: tls.crt
            path: certificado.crt
          - key: tls.key
            path: chaveprivada.key